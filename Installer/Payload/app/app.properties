# ============================================================
# Pixel Chaser — Runtime Configuration
# ============================================================
# Copy this file next to the JAR files before running.
# For single-machine demo: leave defaults as-is (127.0.0.1).
# For two-machine demo: change attacker.host to the attacker's IP.
#
# VICTIM machine: copy this file next to PixelChaser.jar
# ATTACKER machine: copy this file next to Launcher.jar + Helper.jar
# ============================================================

# Attacker machine IP / hostname
# Single-machine demo: 127.0.0.1
# Two-machine demo:    e.g. 192.168.1.100
attacker.host=127.0.0.1

# Ports (change only if there are conflicts)
attacker.controller.port=5000
attacker.portal.port=8080

# ============================================================
# Paths — Local paths for standalone installer installation
# ============================================================

# Path to sandbox data (inside $INSTDIR\app\data)
sandbox.root=data

# Path to sessions.db (inside $INSTDIR\app\sessions.db)
db.path=sessions.db
